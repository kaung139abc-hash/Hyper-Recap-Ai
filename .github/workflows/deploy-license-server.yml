name: Deploy Hyper Recap License Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: license-server/package-lock.json
      - name: Install Wrangler
        run: npm install
      - name: Configure D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
      - name: Initialize remote D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute hyper-recap-licenses --remote --file=./schema.sql
      - name: Set admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          test -n "$ADMIN_SECRET" || (echo "Missing ADMIN_SECRET secret" && exit 1)
          printf '%s' "$ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
