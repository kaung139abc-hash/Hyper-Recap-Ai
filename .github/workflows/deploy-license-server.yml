name: Deploy Hyper Recap License Server

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "license-server/**"
      - ".github/workflows/deploy-license-server.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install
      - name: Configure D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
      - name: Initialize remote D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute hyper-recap-licenses --remote --file=./schema.sql
      - name: Set admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          test -n "$ADMIN_SECRET" || (echo "Missing ADMIN_SECRET secret" && exit 1)
          printf '%s' "$ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET
      - name: Configure optional commercial Burmese neural voice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            printf '%s' "$ELEVENLABS_API_KEY" | npx wrangler secret put ELEVENLABS_API_KEY
            echo "Commercial Burmese Neural Voice secret configured."
          else
            echo "ELEVENLABS_API_KEY is not configured; online neural voice remains disabled."
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: End-to-end license smoke test
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          # Keep this host identical to LicenseManager.SERVER_URL in the Android app.
          BASE="https://kaung139abc.workers.dev"
          curl --fail --silent --show-error "$BASE/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"databaseConfigured":true' /tmp/health.json
          test -n "$ADMIN_SECRET"
          curl --fail --silent --show-error "$BASE/admin" | grep -qi "Hyper Recap AI"

          # Create a short-lived CI license and verify activation, repeat check,
          # and device binding against the real deployed D1 database.
          CREATED=$(curl --fail --silent --show-error -X POST "$BASE/admin/create" \
            -H "Authorization: Bearer $ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"plan":"trial","deviceLimit":1,"customerNote":"automated CI smoke test"}')
          LICENSE_KEY=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.licenseKey) process.exit(1); process.stdout.write(x.licenseKey)' "$CREATED")
          ACTIVATE=$(curl --fail --silent --show-error -X POST "$BASE/v1/activate" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({licenseKey:process.argv[1],deviceId:"ci-smoke-device-1"}))' "$LICENSE_KEY")")
          echo "$ACTIVATE" | grep -q '"valid":true'
          CHECK=$(curl --fail --silent --show-error -X POST "$BASE/v1/check" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({licenseKey:process.argv[1],deviceId:"ci-smoke-device-1"}))' "$LICENSE_KEY")")
          echo "$CHECK" | grep -q '"valid":true'
          SECOND_DEVICE=$(curl --silent --show-error -X POST "$BASE/v1/activate" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({licenseKey:process.argv[1],deviceId:"ci-smoke-device-2"}))' "$LICENSE_KEY")")
          echo "$SECOND_DEVICE" | grep -q '"valid":false'
          echo "$SECOND_DEVICE" | grep -q 'DEVICE_LIMIT'
